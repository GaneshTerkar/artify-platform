services:
  postgres:
    image: postgres:16-alpine
    container_name: artify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: artifyme
    ports:
      - "5432:5432"
    volumes:
      - artify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artifyme"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: artify-minio
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - artify_minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: artify-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - artify_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: artify-redis-ui
    environment:
      - REDIS_HOSTS=local:artify-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  artify_pg_data:
  artify_minio_data:
  artify_redis_data: