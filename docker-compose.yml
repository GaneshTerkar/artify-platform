services:
  postgres:
    image: postgres:16-alpine
    container_name: artify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: artifyme
    ports:
      - "5432:5432"
    volumes:
      - artify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artifyme"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: artify-minio
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - artify_minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: artify-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - artify_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: artify-redis-ui
    environment:
      - REDIS_HOSTS=local:artify-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: artify-redpanda
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://artify-redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - artify_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: artify-redpanda-console
    environment:
      KAFKA_BROKERS: "artify-redpanda:29092"
    ports:
      - "8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  artify_pg_data:
  artify_minio_data:
  artify_redis_data:
  artify_redpanda_data: