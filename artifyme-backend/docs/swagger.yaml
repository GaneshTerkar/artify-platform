basePath: /
definitions:
  artists.AddPaintingRequest:
    properties:
      category:
        $ref: '#/definitions/auth.PaintingCategory'
      description:
        type: string
      image_url:
        type: string
      title:
        type: string
    required:
    - category
    - image_url
    - title
    type: object
  artists.ArtistPainting:
    properties:
      artist_id:
        type: string
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      image_url:
        type: string
      painting_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  artists.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  auth.PaintingCategory:
    enum:
    - PENCIL
    - CHARCOAL
    - OIL
    - ACRYLIC
    - WATERCOLOR
    type: string
    x-enum-varnames:
    - Pencil
    - Charcoal
    - Oil
    - Acrylic
    - WaterColor
host: localhost:8080
info:
  contact:
    email: ganesh@example.com
    name: Ganesh Terkar
  description: Backend API for ArtifyMe platform
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ArtifyMe Backend API
  version: "1.0"
paths:
  /api/artist/paintings/:
    get:
      description: Get all paintings added by the logged-in artist
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/artists.ArtistPainting'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artists.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/artists.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my paintings
      tags:
      - Artist
  /api/artist/paintings/add:
    post:
      consumes:
      - application/json
      description: Artist adds a painting
      parameters:
      - description: Painting details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/artists.AddPaintingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/artists.ArtistPainting'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artists.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artists.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artists.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a new painting
      tags:
      - Artist
  /api/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image (JPG, PNG, WEBP, GIF, HEIC) to storage and returns
        its URL
      parameters:
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload an image file
      tags:
      - Files
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
